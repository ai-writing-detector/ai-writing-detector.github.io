<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./images/favicon.svg">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Writing Detector Installed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

        color: #111827;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
        background: #F7F7F7;
    }

    body {
        min-height: 100vh;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;

      padding-top: 64px;
      padding-bottom: 80px;

      text-align: center;
    }

    h1 {
      margin: 0 0 40px;

      font-size: 38px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .step {
      margin-bottom: 56px;
    }

    .step-text {
      max-width: 760px;
      margin: 0 auto 24px;

      font-size: 20px;
      line-height: 1.5;
      font-weight: 400;
    }

    .screenshot {
      display: block;

      max-width: 100%;
      height: auto;

      margin: 0 auto;

      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 24px);
        padding-top: 40px;
      }

      h1 {
        margin-bottom: 32px;
        font-size: 30px;
      }

      .step-text {
        font-size: 18px;
      }

      .step {
        margin-bottom: 40px;
      }
    }

    .steps-wrapper {
  text-align: center;
  margin-bottom: 32px;
}

.steps {
  display: inline-block;
  margin: 0;
  padding-left: 28px;

  text-align: left;
  font-size: 20px;
  line-height: 1.5;
}

.steps li {
  padding-left: 4px;
}
  </style>
</head>

<body>

  <main class="container">

    <h1>AI Writing Detector Installed</h1>

    <section class="step">

    <div class="steps-wrapper">
    <ol class="steps">
        <li>Click the puzzle piece icon in the top-right corner of your browser.</li>
        <li>Then, click the little pin next to the extension.</li>
    </ol>
    </div>

        <img class="screenshot" src="./images/welcome-step-1.webp" alt="Pin AI Writing Detector">

    </section>


    <section class="step">

      <p class="step-text">
         Simply click on the extension icon to open the <bold>AI Writing Detector</bold>.
      </p>

      <img class="screenshot" src="./images/welcome-step-2.webp" alt="AI Writing Detector pinned">

    </section>

  </main>

</body>
</html>
