<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Writing Detector Installed!</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="./images/favicon.svg"
  >

  <link
    rel="preload"
    as="image"
    href="./images/welcome-step-1.webp"
    fetchpriority="high"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #F7F7F7;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #111827;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;

      padding-top: 64px;
      padding-bottom: 80px;

      text-align: center;
    }

    h1 {
      margin: 0 0 40px;

      font-size: 38px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .steps {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .step {
      margin-bottom: 56px;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .step-heading {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      gap: 8px;

      width: fit-content;
      max-width: 760px;

      margin: 0 auto 24px;

      font-size: 20px;
      line-height: 1.5;
      font-weight: 400;

      text-align: left;
    }

    .step-number {
      flex: 0 0 auto;

      font-weight: 600;
    }

    .step-copy {
      margin: 0;
    }

    .screenshot {
      display: block;

      width: 100%;
      max-width: 900px;
      height: auto;

      margin: 0 auto;

      border-radius: 10px;
    }

    /*
     * Content is revealed strictly from top to bottom.
     */
    .reveal {
      visibility: hidden;
      opacity: 0;
      transform: translateY(10px);

      transition:
        opacity 400ms ease,
        transform 400ms ease;
    }

    .reveal.visible {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        transform: none;
        transition: none;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 24px);
        padding-top: 40px;
      }

      h1 {
        margin-bottom: 32px;
        font-size: 30px;
      }

      .step-heading {
        max-width: 100%;

        margin-bottom: 20px;

        font-size: 18px;
      }

      .step {
        margin-bottom: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1
      class="reveal"
      id="welcome-title"
    >
      AI Writing Detector Installed
    </h1>

    <ol class="steps">

      <li class="step">

        <div
          class="step-heading reveal"
          id="step-1-text"
        >
          <span class="step-number">1.</span>

          <p class="step-copy">
            Pin the extension for quick access to the
            <strong>AI Writing Detector</strong>.
          </p>
        </div>

        <img
          class="screenshot reveal"
          id="step-1-image"
          src="./images/welcome-step-1.webp"
          alt="Pin AI Writing Detector"
          width="1600"
          height="888"
          fetchpriority="high"
          decoding="async"
        >

      </li>

      <li class="step">

        <div
          class="step-heading reveal"
          id="step-2-text"
        >
          <span class="step-number">2.</span>

          <p class="step-copy">
            Simply click on the extension icon to open the
            <strong>AI Writing Detector</strong>.
          </p>
        </div>

        <img
          class="screenshot reveal"
          id="step-2-image"
          src="./images/welcome-step-2.webp"
          alt="AI Writing Detector pinned"
          width="1600"
          height="882"
          fetchpriority="low"
          decoding="async"
        >

      </li>

    </ol>

  </main>

  <script>
    const BETWEEN_ELEMENTS_DELAY_MS = 180;

    const delay = (ms) =>
      new Promise((resolve) => {
        setTimeout(resolve, ms);
      });

    const nextFrame = () =>
      new Promise((resolve) => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resolve);
        });
      });

    const waitForImage = async (image) => {
      if (!image.complete) {
        await new Promise((resolve) => {
          image.addEventListener(
            "load",
            resolve,
            { once: true }
          );

          image.addEventListener(
            "error",
            resolve,
            { once: true }
          );
        });
      }

      if (typeof image.decode === "function") {
        try {
          await image.decode();
        } catch {
          // Reveal anyway if decoding fails.
        }
      }
    };

    const reveal = async (element) => {
      await nextFrame();

      element.classList.add("visible");

      await delay(BETWEEN_ELEMENTS_DELAY_MS);
    };

    const start = async () => {
      const title =
        document.getElementById("welcome-title");

      const step1Text =
        document.getElementById("step-1-text");

      const step1Image =
        document.getElementById("step-1-image");

      const step2Text =
        document.getElementById("step-2-text");

      const step2Image =
        document.getElementById("step-2-image");

      await reveal(title);

      await reveal(step1Text);

      await waitForImage(step1Image);
      await reveal(step1Image);

      await reveal(step2Text);

      await waitForImage(step2Image);
      await reveal(step2Image);
    };

    start();
  </script>

</body>
</html>
